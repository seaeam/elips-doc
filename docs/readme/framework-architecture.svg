<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 906" fill="#263b45" role="img" aria-labelledby="title desc">
<title id="title">ELPIS 框架架构</title><desc id="desc">展示层使用 Vue 3、Element Plus 和 Dashboard 模板，包含 Schema、Custom、Iframe 视图。请求进入 Node.js 与 Koa BFF 的接入层，再由 Controller 调用 Service，访问 MySQL 或外部服务。elpis-core 加载服务端模块，Webpack 5 负责前端构建。</desc>
<defs>
  <pattern id="paper-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".7" fill="#8e9ba0" opacity=".18"/></pattern>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#263b45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; } .hand { font-family: "Chalkboard SE", "Comic Sans MS", cursive; }</style>
</defs>
<rect width="1120" height="906" rx="18" fill="#fbf7ed"/>
<rect width="1120" height="906" rx="18" fill="url(#paper-dots)"/>
<text x="52" y="59" font-size="34" font-weight="700">ELPIS 整体架构</text><path d="M 52 77 Q 181 72 334 78" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#f8e9b6" stroke-width="9" opacity=".9"/><text x="52" y="116" font-size="22" fill="#52616a">展示层处理交互，BFF 组织业务，数据层提供存储与服务。</text><text x="1068" y="55" font-size="18" text-anchor="end" class="hand" letter-spacing="2">01 / ARCHITECTURE</text><g transform="translate(1048 103) scale(0.7)"><path d="M 0 -13 L 4 -4 L 14 -3 L 6 4 L 9 14 L 0 8 L -10 14 L -7 3 L -14 -3 L -4 -5 Z" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="#f8e9b6"/></g><path d="M 60 169 Q 560 167.85947666037828 1062 170 Q 1070 171 1068 179 L 1067.3323880434036 373 Q 1068 382 1058 380 Q 560 380.15221831109375 57 380 Q 50 380 52 372 L 52.12854521162808 177 Q 52 168 60 169 Z" fill="#dae9f1" stroke="#263b45" stroke-width="2.2"/><path d="M 64 385 Q 560 387 1073 384 L 1073 183" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><text x="78" y="211" font-size="28" font-weight="700">展示层 · Vue 3 + Element Plus</text><path d="M 86 237 Q 223 236.66265712026507 362 238 Q 370 239 368 247 L 369.28738110139966 344 Q 368 353 358 351 Q 223 349.97207916062325 83 351 Q 76 351 78 343 L 79.00910831056535 245 Q 78 236 86 237 Z" fill="#fbf7ed" stroke="#263b45" stroke-width="2.2"/><path d="M 90 356 Q 223 358 373 355 L 373 251" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><text x="100" y="274" font-size="25" font-weight="700">Dashboard 模板</text><text x="100" y="312" font-size="21" >头部导航 · 侧栏 · 路由</text><path d="M 423 237 Q 560 235.95491568464786 699 238 Q 707 239 705 247 L 704.9742603674531 344 Q 705 353 695 351 Q 560 351.6824067598209 420 351 Q 413 351 415 343 L 415.0561627391726 245 Q 415 236 423 237 Z" fill="#fbf7ed" stroke="#263b45" stroke-width="2.2"/><path d="M 427 356 Q 560 358 710 355 L 710 251" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><text x="437" y="274" font-size="25" font-weight="700">Schema View</text><text x="437" y="312" font-size="21" >搜索 · 表格 · 动态表单</text><path d="M 759 237 Q 896 238.2276931265369 1035 238 Q 1043 239 1041 247 L 1039.8457207344472 344 Q 1041 353 1031 351 Q 896 349.24977768491954 756 351 Q 749 351 751 343 L 751.1452625822276 245 Q 751 236 759 237 Z" fill="#fbf7ed" stroke="#263b45" stroke-width="2.2"/><path d="M 763 356 Q 896 358 1046 355 L 1046 251" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><text x="773" y="274" font-size="25" font-weight="700">扩展视图</text><text x="773" y="312" font-size="21" >Custom View / Iframe</text><path d="M 560 387 Q 555 415 560 445" fill="none" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="590" y="423" font-size="21" >页面与接口请求</text><path d="M 60 452 Q 560 450.143954266794 1062 453 Q 1070 454 1068 462 L 1066.4202072173357 634 Q 1068 643 1058 641 Q 560 641.3627075990662 57 641 Q 50 641 52 633 L 52.81060755439103 460 Q 52 451 60 452 Z" fill="#e3ecd9" stroke="#263b45" stroke-width="2.2"/><path d="M 64 646 Q 560 648 1073 645 L 1073 466" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><text x="78" y="493" font-size="28" font-weight="700">BFF · Node.js + Koa</text><path d="M 86 519 Q 223 520.4837446147576 362 520 Q 370 521 368 529 L 366.9491512812674 608 Q 368 617 358 615 Q 223 615.9807235179469 83 615 Q 76 615 78 607 L 77.75798245333135 527 Q 78 518 86 519 Z" fill="#fbf7ed" stroke="#263b45" stroke-width="2.2"/><path d="M 90 620 Q 223 622 373 619 L 373 533" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><text x="100" y="556" font-size="25" font-weight="700">接入层</text><text x="100" y="594" font-size="21" >Router · 校验 · 中间件</text><path d="M 423 519 Q 560 519.6874032588676 699 520 Q 707 521 705 529 L 705.8537384197116 608 Q 705 617 695 615 Q 560 616.8873423254117 420 615 Q 413 615 415 607 L 416.42847786284983 527 Q 415 518 423 519 Z" fill="#fbf7ed" stroke="#263b45" stroke-width="2.2"/><path d="M 427 620 Q 560 622 710 619 L 710 533" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><text x="437" y="556" font-size="25" font-weight="700">Controller</text><text x="437" y="594" font-size="21" >参数整理 · 业务处理</text><path d="M 759 519 Q 896 517.0589320072904 1035 520 Q 1043 521 1041 529 L 1041.7437069825828 608 Q 1041 617 1031 615 Q 896 614.8094555390999 756 615 Q 749 615 751 607 L 749.9254921060055 527 Q 751 518 759 519 Z" fill="#fbf7ed" stroke="#263b45" stroke-width="2.2"/><path d="M 763 620 Q 896 622 1046 619 L 1046 533" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><text x="773" y="556" font-size="25" font-weight="700">Service</text><text x="773" y="594" font-size="21" >数据访问 · 服务调用</text><path d="M 375 565 Q 390 561 407 565" fill="none" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 712 565 Q 728 569 743 565" fill="none" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 899 648 Q 894 674 899 704" fill="none" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="668" y="682" font-size="21" >读写数据 / 调用服务</text><path d="M 60 711 Q 560 710.6920207785442 1062 712 Q 1070 713 1068 721 L 1069.830678254366 810 Q 1068 819 1058 817 Q 560 815.6656203260645 57 817 Q 50 817 52 809 L 52.6175144482404 719 Q 52 710 60 711 Z" fill="#f7dfd0" stroke="#263b45" stroke-width="2.2"/><path d="M 64 822 Q 560 824 1073 821 L 1073 725" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><text x="78" y="752" font-size="27" font-weight="700">数据与基础服务</text><text x="78" y="789" font-size="23" >MySQL · 业务数据</text><text x="451" y="789" font-size="23" >外部服务</text><text x="770" y="789" font-size="23" >Log4js · 日志</text><text x="52" y="852" font-size="21" >elpis-core 加载服务端模块；Webpack 5 编译前端页面与资源。</text>
<text x="52" y="882" font-size="15" class="hand" letter-spacing="2">506 LAB  /  ELPIS COURSE NOTES</text>
</svg>
