。</text><path d="M 618 174 Q 833 174.46401520539075 1050 175 Q 1058 176 1056 184 L 1057.8540249317884 378 Q 1056 387 1046 385 Q 833 384.7938570519909 615 385 Q 608 385 610 377 L 608.8537370879203 182 Q 610 173 618 174 Z" fill="#dae9f1" stroke="#263b45" stroke-width="2.2"/><path d="M 622 390 Q 833 392 1061 389 L 1061 188" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><ellipse cx="646" cy="211" rx="27" ry="25" fill="#fbf7ed" stroke="#263b45" stroke-width="2.3" transform="rotate(-6 646 211)"/><text x="646" y="219" font-size="25" text-anchor="middle" font-weight="700" class="hand">02</text><text x="689" y="220" font-size="29" font-weight="700">内核与工程化</text><text x="637" y="267" font-size="22" font-weight="600">第 04–05 章  /  17 节</text><text x="637" y="310" font-size="22" >Node.js 内核 + Webpack 5</text><text x="637" y="345" font-size="22" >搭建服务端与构建环境。</text><path d="M 618 455 Q 833 456.6705424422398 1050 456 Q 1058 457 1056 465 L 1056.6029411293566 659 Q 1056 668 1046 666 Q 833 665.5276142237708 615 666 Q 608 666 610 658 L 609.0100939776748 463 Q 610 454 618 455 Z" fill="#e3ecd9" stroke="#263b45" stroke-width="2.2"/><path d="M 622 671 Q 833 673 1061 670 L 1061 469" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><ellipse cx="646" cy="492" rx="27" ry="25" fill="#fbf7ed" stroke="#263b45" stroke-width="2.3" transform="rotate(-6 646 492)"/><text x="646" y="500" font-size="25" text-anchor="middle" font-weight="700" class="hand">03</text><text x="689" y="501" font-size="29" font-weight="700">模型与组件</text><text x="637" y="548" font-size="22" font-weight="600">第 06–07 章  /  25 节</text><text x="637" y="591" font-size="22" >领域模型 + Vue 3 动态组件</text><text x="637" y="626" font-size="22" >从 DSL 配置生成业务页面。</text><path d="M 70 455 Q 285 456.6224611075595 502 456 Q 510 457 508 465 L 508.0193323716521 659 Q 508 668 498 666 Q 285 666.1601961469278 67 666 Q 60 666 62 658 L 61.435736844316125 463 Q 62 454 70 455 Z" fill="#f7dfd0" stroke="#263b45" stroke-width="2.2"/><path d="M 74 671 Q 285 673 513 670 L 513 469" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><ellipse cx="98" cy="492" rx="27" ry="25" fill="#fbf7ed" stroke="#263b45" stroke-width="2.3" transform="rotate(-6 98 492)"/><text x="98" y="500" font-size="25" text-anchor="middle" font-weight="700" class="hand">04</text><text x="141" y="501" font-size="29" font-weight="700">发布与实践</text><text x="89" y="548" font-size="22" font-weight="600">第 08–09 章  /  10 节</text><text x="89" y="591" font-size="22" >npm 封装 → 框架应用 → CI/CD</text><text x="89" y="626" font-size="22" >发布框架，完成业务开发与部署。</text><path d="M 437 395 Q 555 393.8150571892038 675 396 Q 683 397 681 405 L 679.012131344527 426 Q 681 435 671 433 Q 555 432.8705207062885 434 433 Q 427 433 429 425 L 428.42290678434074 403 Q 429 394 437 395 Z" fill="#fbf7ed" stroke="#263b45" stroke-width="2.2"/><path d="M 441 438 Q 555 440 686 437 L 686 409" fill="none" stroke="#263b45" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-width="1.5"/><text x="443" y="421" font-size="19" font-weight="600">按章节顺序学习</text>
