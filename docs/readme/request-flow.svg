<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 811" fill="#263b45" role="img" aria-labelledby="title desc">
<title id="title">人员列表查询流程</title><desc id="desc">页面向接入层发送查询条件和分页参数；接入层校验后调用 Controller，Controller 调用 Service，Service 访问数据源。数据记录沿反方向返回，由 Controller 组织分页结果，最后页面更新列表。实线表示调用，虚线表示返回。</desc>
<defs>
  <pattern id="paper-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".7" fill="#8e9ba0" opacity=".18"/></pattern>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#263b45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; } .hand { font-family: "Chalkboard SE", "Comic Sans MS", cursive; }</style>
</defs>
<rect width="1120" height="811" rx="18" fill="#fbf7ed"/>
<rect width="1120" height="811" rx="18" fill="url(#paper-dots)"/>
