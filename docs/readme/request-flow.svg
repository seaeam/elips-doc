nd" opacity=".16" stroke-width="1.5"/><text x="972" y="205" font-size="24" text-anchor="middle" font-weight="700">数据源</text><text x="972" y="237" font-size="18" text-anchor="middle">MySQL / 外部服务</text><path d="M 972 265 L 972 699" fill="none" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8" opacity=".28"/><path d="M 148 310 Q 247 312 346 310" fill="none" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="247" y="297" font-size="19" text-anchor="middle">查询条件 / 分页</text><path d="M 354 368 Q 453 370 552 368" fill="none" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="453" y="355" font-size="19" text-anchor="middle">通过校验</text><path d="M 560 426 Q 659 428 758 426" fill="none" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="659" y="413" font-size="19" text-anchor="middle">查询业务数据</text><path d="M 766 484 Q 865 486 964 484" fill="none" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="865" y="471" font-size="19" text-anchor="middle">读库 / 调用服务</text><path d="M 972 535 Q 873 537 774 535" fill="none" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="873" y="522" font-size="19" text-anchor="middle">数据记录</text><path d="M 766 583 Q 667 585 568 583" fill="none" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="667" y="570" font-size="19" text-anchor="middle">返回查询结果</text><path d="M 560 631 Q 461 633 362 631" fill="none" stroke="#263b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="461" y="618" 