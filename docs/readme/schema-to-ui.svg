<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 758" fill="#263b45" role="img" aria-labelledby="title desc">
<title id="title">字段配置与界面组件</title><desc id="desc">商品名称字段的 tableOption 由 SchemaTable 消费，searchOption 由 SchemaSearchBar 消费，createFormOption 和 editFormOption 用于新增和编辑表单。界面中的商品与价格仅为示意数据。</desc>
<defs>
